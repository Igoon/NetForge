server {
  listen 80;
  server_name _;
  root /var/www/html/public;
  server_tokens off;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  add_header X-Content-Type-Options nosniff always;

  # Nginx-only liveness probe (no PHP): confirms the reverse proxy is up.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/v1/ {
    limit_req zone=auth_api burst=25 nodelay;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/router.php;
    fastcgi_param SCRIPT_NAME /router.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_X_FORWARDED_PROTO https;
    fastcgi_connect_timeout 5s;
    fastcgi_send_timeout 30s;
    fastcgi_read_timeout 30s;
    fastcgi_pass php:9000;
  }
  location / { return 404; }
}
