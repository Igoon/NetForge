<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NET FORGE — PWA Recovery</title><style>body{font:16px system-ui;background:#0b1220;color:#e8f0fb;max-width:650px;margin:70px auto;padding:20px}button,a{padding:12px;color:#4dd7e8}button{background:#17253a;border:1px solid #4dd7e8;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap}</style></head><body><h1>NET FORGE — Pemulihan PWA</h1><p>Gunakan fitur ini jika update PWA tidak aktif. Progres permainan (localStorage/IndexedDB) tidak dihapus.</p><button id="fix">Bersihkan cache aplikasi dan muat ulang</button><p id="status" role="status"></p><p><a href="./">Kembali ke NET FORGE</a></p><script>document.getElementById('fix').onclick=async()=>{const out=document.getElementById('status');try{if(!('serviceWorker' in navigator))throw Error('Service Worker tidak tersedia');const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()));const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('netforge-app-')).map(k=>caches.delete(k)));out.textContent='Cache PWA dibersihkan, data pemain tetap tersimpan. Membuka game…';location.replace('./?pwa-repair='+Date.now())}catch(e){out.textContent='Gagal: '+e.message}}</script></body></html>
