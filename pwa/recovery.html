<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NET FORGE Recovery</title><body style="font:16px system-ui;background:#0b1220;color:white;padding:2rem"><h1>NET FORGE — Pemulihan PWA</h1><p>Jika versi lama tetap muncul, bersihkan cache PWA dan buka kembali aplikasi.</p><button onclick="caches.keys().then(k=>Promise.all(k.map(x=>caches.delete(x)))).then(()=>location.href='./')">Bersihkan cache &amp; buka aplikasi</button></body></html>
