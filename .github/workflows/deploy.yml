name: Deploy NET FORGE PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: netforge-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage PWA files
        run: |
          mkdir -p dist
          cp pwa/index.html pwa/recovery.html pwa/manifest.webmanifest pwa/sw.js pwa/version.json dist/
          cp -R pwa/icons dist/
          test -f dist/index.html
          test -f dist/recovery.html
          test -f dist/sw.js
          test -f dist/version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
