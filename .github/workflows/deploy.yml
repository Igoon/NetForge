name: Deploy NET FORGE PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: netforge-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest PWA source
        id: source
        run: |
          newest=$(for src in . pwa frontend; do
            if [ -f "$src/version.json" ]; then
              ver=$(node -p "require('./$src/version.json').version")
              echo "$ver $src"
            fi
          done | sort -V | tail -n1)
          src=$(echo "$newest" | awk '{print $2}')
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "Using $src ($newest)"

      - name: Stage PWA files
        run: |
          SRC="${{ steps.source.outputs.src }}"
          mkdir -p dist
          cp "$SRC/index.html" "$SRC/recovery.html" "$SRC/manifest.webmanifest" "$SRC/sw.js" "$SRC/version.json" dist/
          cp -R "$SRC/icons" dist/
          test -f dist/index.html
          test -f dist/recovery.html
          test -f dist/sw.js
          test -f dist/version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
